<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  background: radial-gradient(circle at top, #020617, #000);
  color:white;
  display:flex;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner{
  width:70px;
  height:70px;
  border:5px solid rgba(255,255,255,0.1);
  border-top:5px solid #00f7ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.03);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.sidebar h2{
  margin-bottom:40px;
  color:#00f7ff;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#94a3b8;
}

.sidebar a:hover{
  background:rgba(0,247,255,0.1);
  color:#00f7ff;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

/* LIVE STATUS */
.live{
  color:#00f7ff;
  font-size:14px;
}

/* BUTTON */
.btn{
  padding:8px 12px;
  background:#00f7ff;
  border:none;
  border-radius:8px;
  color:black;
  cursor:pointer;
}

/* STATS */
.stats{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

.stat{
  flex:1;
  padding:15px;
  border-radius:12px;
  background:rgba(0,247,255,0.05);
  text-align:center;
  border:1px solid rgba(0,247,255,0.2);
}

/* TABLE */
.table{
  background:rgba(255,255,255,0.04);
  padding:15px;
  border-radius:16px;
  backdrop-filter:blur(15px);
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

tr:hover{
  background:rgba(0,247,255,0.05);
}

.present{color:#22c55e}
.absent{color:#ef4444}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>⚡ AI System</h2>
  <a href="/dashboard">Dashboard</a>
  <a href="/students">Students</a>
  <a href="/attendance" style="background:rgba(0,247,255,0.1);color:#00f7ff;">Attendance</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="top">
  <form method="GET" action="/attendance">
    <input type="date" name="date" value="{{ selected_date }}">
  </form>

  <div>
    <span class="live">🟢 Live Detection Active</span>
    <button class="btn" onclick="location.reload()">Refresh</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat">👨‍🎓 Total: {{ total }}</div>
  <div class="stat">✅ Present: {{ present }}</div>
  <div class="stat">❌ Absent: {{ absent }}</div>
</div>

<!-- TABLE -->
<div class="table">
<table>

<tr>
  <th>Student ID</th>
  <th>Time</th>
  <th>Status</th>
</tr>

{% for r in records %}
<tr>
  <td>
  {{ r.student_id }}
</td>
  <td>{{ r.timestamp }}</td>
  <td class="{{ 'present' if r.status == 'Present' else 'absent' }}">
    {{ r.status }}
  </td>
</tr>
{% endfor %}

</table>
</div>

</div>

<!-- JS -->
<script>
// loader
window.addEventListener("load", () => {
  const loader = document.getElementById("loader");
  loader.style.opacity = "0";
  setTimeout(()=>loader.style.display="none",400);
});

// navigation loader
document.querySelectorAll("a").forEach(link=>{
  link.addEventListener("click",()=>{
    document.getElementById("loader").style.display="flex";
  });
});

// auto-submit date filter
document.querySelector("input[type='date']").addEventListener("change", function(){
    this.form.submit();
});

// 🔥 AUTO REFRESH EVERY 10 SEC
setInterval(() => {
    location.reload();
}, 10000);
</script>

</body>
</html>

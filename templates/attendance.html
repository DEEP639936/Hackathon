<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{background:#020617;color:white;display:flex}

/* SIDEBAR */
.sidebar{
  width:220px;
  height:100vh;
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.sidebar h2{color:#3b82f6;margin-bottom:30px}

.sidebar li{
  list-style:none;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  color:#94a3b8;
}

.sidebar li:hover{background:#1e293b;color:white}

/* MAIN */
.main{flex:1;padding:20px}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* STATS */
.stats{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.stat{
  flex:1;
  padding:15px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  text-align:center;
}

/* TABLE */
.table{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.present{color:#22c55e}
.absent{color:#ef4444}

/* LIVE STATUS */
.live{
  color:#22c55e;
  font-size:14px;
}

.btn{
  padding:8px 12px;
  background:#3b82f6;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

</style>
</head>
<body>

<div class="sidebar">
  <h2>AI System</h2>
  <ul>
    <li onclick="location.href='/dashboard'">Dashboard</li>
    <li onclick="location.href='/students'">Students</li>
    <li style="background:#1e293b;color:white;">Attendance</li>
  </ul>
</div>

<div class="main">

<div class="top">
  <form method="GET" action="/attendance">
  <input type="date" name="date" value="{{ selected_date }}">
  </form>
  <div>
    <span class="live">🟢 Live Detection Active</span>
    <button class="btn">Refresh</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat">👨‍🎓 Total: {{ total }}</div>
  <div class="stat">✅ Present: {{ present }}</div>
  <div class="stat">❌ Absent: {{ absent }}</div>
</div>

<!-- TABLE -->
<div class="table">
<table>
<tr>
<th>Name</th>
<th>ID</th>
<th>Time</th>
<th>Status</th>
</tr>

{% for r in records %}
<tr>
  <td>{{ r.student_id }}</td>
  <td>{{ r.timestamp }}</td>
  <td>{{ r.status }}</td>
</tr>
{% endfor %}

</table>

<script>
document.querySelector("input[type='date']").addEventListener("change", function(){
    this.form.submit();
});
</script>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{background:#020617;color:white;display:flex}

/* SIDEBAR */
.sidebar{
  width:220px;
  height:100vh;
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.sidebar h2{color:#3b82f6;margin-bottom:30px}

.sidebar li{
  list-style:none;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  color:#94a3b8;
}

.sidebar li:hover{background:#1e293b;color:white}

/* MAIN */
.main{flex:1;padding:30px}

/* FORM CARD */
.card{
  max-width:600px;
  margin:auto;
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.1);
}

/* INPUT */
.input{
  margin-bottom:15px;
}

.input input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  background:#1e293b;
  color:white;
}

/* IMAGE UPLOAD */
.upload{
  border:2px dashed #3b82f6;
  padding:30px;
  text-align:center;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:15px;
}

.upload:hover{
  background:#1e293b;
}

/* PREVIEW */
.preview{
  text-align:center;
  margin-bottom:15px;
}

.preview img{
  width:120px;
  height:120px;
  border-radius:10px;
  object-fit:cover;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  background:#3b82f6;
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* AI STATUS */
.status{
  margin-top:10px;
  font-size:13px;
  color:#22c55e;
}

.preview img{
  width:120px;
  height:120px;
  border-radius:10px;
  object-fit:cover;
  border:2px solid #3b82f6;
}

</style>
</head>
<body>

<div class="sidebar">
  <h2>AI System</h2>
  <ul>
    <li onclick="location.href='/dashboard'">Dashboard</li>
    <li onclick="location.href='/students'">Students</li>
    <li style="background:#1e293b;color:white;">Add Student</li>
  </ul>
</div>

<div class="main">

<div class="card">

<h2>Add New Student</h2>

<form action="/add-student" method="POST" enctype="multipart/form-data">

<div class="input">
<input type="text" placeholder="Student Name" name='name'>
<br>
<br>
<input type="text" placeholder="Class" name='class'>
</div>

</div>

<div class="upload" onclick="document.getElementById('file').click()">
📸 Click to Upload Face Image
<input type="file" id="file" name='image' hidden>
</div>

<div class="preview">
  <img id="previewImg" src="" alt="Preview will appear here">
</div>

<button type="submit" class='btn'>Save Student</button>

<div class="status" id="status"></div>

</form>

</div>

</div>

<script>

// preview image
document.getElementById("file").addEventListener("change", function(e){
  const file = e.target.files[0]
  if(file){
    document.getElementById("previewImg").src = URL.createObjectURL(file)
  }
})

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  background: radial-gradient(circle at top, #020617, #000);
  color:white;
  display:flex;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner{
  width:70px;
  height:70px;
  border:5px solid rgba(255,255,255,0.1);
  border-top:5px solid #00f7ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.03);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.sidebar h2{
  margin-bottom:40px;
  color:#00f7ff;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#94a3b8;
}

.sidebar a:hover{
  background:rgba(0,247,255,0.1);
  color:#00f7ff;
}

/* MAIN */
.main{
  flex:1;
  padding:30px;
}

/* CARD */
.card{
  max-width:500px;
  margin:auto;
  background:rgba(255,255,255,0.04);
  padding:25px;
  border-radius:16px;
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.08);
}

/* INPUT */
.input{
  margin-bottom:15px;
}

.input input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.05);
  color:white;
  outline:none;
}

/* UPLOAD */
.upload{
  border:2px dashed #00f7ff;
  padding:25px;
  text-align:center;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:15px;
  transition:0.3s;
}

.upload:hover{
  background:rgba(0,247,255,0.05);
}

/* PREVIEW */
.preview{
  text-align:center;
  margin-bottom:15px;
}

.preview img{
  width:120px;
  height:120px;
  border-radius:12px;
  object-fit:cover;
  border:2px solid #00f7ff;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  background:#00f7ff;
  border:none;
  border-radius:10px;
  color:black;
  cursor:pointer;
  font-weight:600;
}

/* STATUS */
.status{
  margin-top:10px;
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>⚡ AI System</h2>
  <a href="/dashboard">Dashboard</a>
  <a href="/students">Students</a>
  <a href="/add-student" style="background:rgba(0,247,255,0.1);color:#00f7ff;">Add Student</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="card">

<h2 style="margin-bottom:20px;color:#00f7ff;">➕ Add New Student</h2>

<form action="/add-student" method="POST" enctype="multipart/form-data">

<div class="input">
<input type="text" name="name" placeholder="Student Name" required>
</div>

<div class="input">
<input type="text" name="class" placeholder="Class" required>
</div>

<div class="upload" onclick="document.getElementById('file').click()">
📸 Click to Upload Face Image
<input type="file" id="file" name="image" accept="image/*" hidden required>
</div>

<div class="preview">
  <img id="previewImg" src="" alt="Preview">
</div>

<button type="submit" class="btn">Save Student</button>

<div class="status" id="status"></div>

</form>

</div>

</div>

<!-- JS -->
<script>
// loader
window.addEventListener("load", () => {
  const loader = document.getElementById("loader");
  loader.style.opacity = "0";
  setTimeout(()=>loader.style.display="none",400);
});

// navigation loader
document.querySelectorAll("a").forEach(link=>{
  link.addEventListener("click",()=>{
    document.getElementById("loader").style.display="flex";
  });
});

// image preview
document.getElementById("file").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(file){
    document.getElementById("previewImg").src = URL.createObjectURL(file);
  }
});

// form validation
document.querySelector("form").addEventListener("submit", function(e){
  const name = document.querySelector("input[name='name']").value.trim();
  const cls = document.querySelector("input[name='class']").value.trim();
  const file = document.getElementById("file").files.length;

  if(!name || !cls || !file){
    e.preventDefault();
    document.getElementById("status").innerText = "❌ Please fill all fields properly";
  } else {
    document.getElementById("status").innerText = "⏳ Processing...";
  }
});
</script>

</body>
</html>

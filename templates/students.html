<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  background: radial-gradient(circle at top, #020617, #000);
  color:white;
  display:flex;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.spinner{
  width:70px;
  height:70px;
  border:5px solid rgba(255,255,255,0.1);
  border-top:5px solid #00f7ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.03);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.sidebar h2{
  margin-bottom:40px;
  color:#00f7ff;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#94a3b8;
}

.sidebar a:hover{
  background:rgba(0,247,255,0.1);
  color:#00f7ff;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* SEARCH */
.search{
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.05);
  color:white;
  width:250px;
  outline:none;
}

/* BUTTON */
.btn{
  padding:10px 15px;
  background:#00f7ff;
  border:none;
  border-radius:10px;
  color:black;
  cursor:pointer;
}

/* TABLE */
.table{
  background:rgba(255,255,255,0.04);
  border-radius:16px;
  padding:15px;
  backdrop-filter:blur(15px);
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

tr:hover{
  background:rgba(0,247,255,0.05);
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>⚡ AI System</h2>
  <a href="/dashboard">Dashboard</a>
  <a href="/students" style="background:rgba(0,247,255,0.1);color:#00f7ff;">Students</a>
  <a href="/attendance">Attendance</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="top">
  <input type="text" id="search" class="search" placeholder="Search students...">
  <button onclick="location.href='/add-student'" class="btn">+ Add Student</button>
</div>

<div class="table">
<table>

<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Class</th>
</tr>

{% for s in students %}
<tr>
  <td>
  {{ s.id }}
</td>
  <td>{{ s.name }}</td>
  <td>{{ s.class }}</td>
</tr>
{% endfor %}

</table>
</div>

</div>

<!-- JS -->
<script>
// loader
window.addEventListener("load", () => {
  const loader = document.getElementById("loader");
  loader.style.opacity = "0";
  setTimeout(()=>loader.style.display="none",400);
});

// show loader on navigation
document.querySelectorAll("a").forEach(link=>{
  link.addEventListener("click",()=>{
    document.getElementById("loader").style.display="flex";
  });
});

// 🔥 SEARCH FILTER (REAL FUNCTIONALITY)
document.getElementById("search").addEventListener("keyup", function(){
  let filter = this.value.toLowerCase();
  let rows = document.querySelectorAll("#studentTable tr");

  rows.forEach((row, index) => {
    if(index === 0) return; // skip header

    let text = row.innerText.toLowerCase();

    row.style.display = text.includes(filter) ? "" : "none";
  });
});
</script>

</body>
</html>

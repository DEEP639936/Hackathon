<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{background:#020617;color:white;display:flex}

/* SIDEBAR SAME AS DASHBOARD */
.sidebar{
  width:220px;
  height:100vh;
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.sidebar h2{color:#3b82f6;margin-bottom:30px}

.sidebar li{
  list-style:none;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  color:#94a3b8;
}

.sidebar li:hover{background:#1e293b;color:white}

/* MAIN */
.main{flex:1;padding:20px}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.search{
  padding:10px;
  border-radius:8px;
  border:none;
  width:250px;
}

.btn{
  padding:10px 15px;
  background:#3b82f6;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* TABLE */
.table{
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  padding:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

img{
  width:40px;
  height:40px;
  border-radius:50%;
}

.status{
  color:#22c55e;
}

.action button{
  background:none;
  border:none;
  color:#3b82f6;
  cursor:pointer;
}

</style>
</head>
<body>

<div class="sidebar">
  <h2>AI System</h2>
  <ul>
    <li onclick="location.href='/dashboard'">Dashboard</li>
    <li style="background:#1e293b;color:white;">Students</li>
    <li onclick="location.href='/attendance'">Attendance</li>
  </ul>
</div>

<div class="main">

<div class="top">
  <input type="text" class="search" placeholder="Search students...">
  <button type='submit'onclick="location.href='/add-student'" class="btn" >+ Add Student</button>
</div>

<div class="table">
<table>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Class</th>
</tr>

{% for s in students %}
<tr>
  <td>{{ s.id }}</td>
  <td>{{ s.name }}</td>
  <td>{{ s.class }}</td>
</tr>
{% endfor %}
</table>
</div>

</div>

</body>
</html>
